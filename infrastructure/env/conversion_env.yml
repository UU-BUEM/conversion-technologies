# Conda environment spec for conversion-technologies.
# Create:  conda env create -f infrastructure/env/conversion_env.yml
# Update:  conda env update -f infrastructure/env/conversion_env.yml --prune
#
# weather (below, under pip:) is tracked at @main rather than a pinned tag,
# so `conda env update ... --prune` always picks up its latest pushed
# changes -- re-run the update command above periodically to refresh. Pin to
# a specific released tag instead (e.g. @v3.0.0) if you need a reproducible,
# non-moving environment. Matches UU-BUEM/buem's infrastructure/env/
# buem_env.yml convention for the same dependency.
#
# dask/netcdf4/xarray are weather[pointquery]'s own runtime dependencies,
# listed explicitly here as conda packages rather than left for pip to
# resolve -- pip only reinstalls a dependency if what's already there
# doesn't satisfy the requirement, so as long as conda installs a
# satisfying version first, pip's install of weather just finds everything
# already present and installs the package code itself. `dask` specifically
# is needed at runtime by weather's xr.open_mfdataset point-query path but
# is not declared by weather[pointquery]'s own extras (confirmed against
# UU-BUEM/buem's infrastructure/env/buem_env.yml, which hits the same gap).
name: conversion_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy=1.26.*
  - pandas=2.*
  - dask
  - netcdf4
  - xarray
  - pytest=8.*
  - pytest-cov=5.*
  - pip
  - pip:
      - ruamel.yaml>=0.18,<1  # comment-preserving YAML writer for Calliope tech configs
      - ruff>=0.6
      - mypy>=1.8
      # weather (https://github.com/UU-BUEM/weather): compulsory (2026-07-28)
      # -- weather-cop's hourly heat pump COP comes from its real
      # per-location get_point_weather() fetch, no bundled/CSV fallback.
      # Not published to PyPI/conda yet, so a direct git reference
      # (PEP 508). All of its own runtime dependencies are already
      # conda-installed above, so this line only adds the package code
      # itself.
      - weather[pointquery] @ git+https://github.com/UU-BUEM/weather.git@main
