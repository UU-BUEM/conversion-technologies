# Conda environment spec for conversion-technologies.
# Create:  conda env create -f infrastructure/env/conversion_env.yml
# Update:  conda env update -f infrastructure/env/conversion_env.yml --prune
name: conversion_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy=1.26.*
  - pandas=2.*
  - pytest=8.*
  - pytest-cov=5.*
  - pip
  - pip:
      - ruamel.yaml>=0.18,<1  # comment-preserving YAML writer for Calliope tech configs
      - ruff>=0.6
      - mypy>=1.8
