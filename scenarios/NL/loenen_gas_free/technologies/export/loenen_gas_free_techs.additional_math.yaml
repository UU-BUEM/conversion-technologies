parameters:
  carrier_flow_ratio_in:
    description: Fixed ratio of a technology's secondary input carrier flow to its primary input 
      carrier flow (e.g. a heat pump's free heat source relative to its electricity draw).
    default: 1
  carrier_flow_ratio_out:
    description: Fixed ratio of a technology's secondary output carrier flow to its primary output 
      carrier flow (e.g. CHP heat relative to its electricity output).
    default: 1
  flow_out_max_relative:
    description: Upper bound on a technology's output as a fraction of its capacity in each timestep
      (0-1), e.g. the share of an hour an electric vehicle is connected to its charger.
    default: 1
  storage_final_min:
    description: Minimum stored level in the last timestep, as a fraction of storage capacity (0-1);
      0 = not set. For use with cyclic_storage false, e.g. so an EV battery ends the year at least 
      where a simulated year ends.
    default: 0
constraints:
  link_flow_in_carriers:
    description: Ties each technology's secondary input carrier to its primary input carrier via 
      carrier_flow_ratio_in.
    foreach:
      - nodes
      - techs
      - timesteps
    where: carrier_flow_ratio_in AND [chiller_absorption_community, heat_pump_electric_building, 
      heat_pump_electric_community, heat_pump_electric_household, heat_pump_geothermal_building, 
      heat_pump_geothermal_community, heat_pump_geothermal_household] in techs
    equations:
      - where: '[chiller_absorption_community] in techs'
        expression: flow_in[carriers=electricity] == flow_in[carriers=heat] * carrier_flow_ratio_in
      - where: '[heat_pump_electric_building] in techs'
        expression: flow_in[carriers=ambient_heat] == flow_in[carriers=electricity] * 
          carrier_flow_ratio_in
      - where: '[heat_pump_electric_community] in techs'
        expression: flow_in[carriers=ambient_heat] == flow_in[carriers=electricity] * 
          carrier_flow_ratio_in
      - where: '[heat_pump_electric_household] in techs'
        expression: flow_in[carriers=ambient_heat] == flow_in[carriers=electricity] * 
          carrier_flow_ratio_in
      - where: '[heat_pump_geothermal_building] in techs'
        expression: flow_in[carriers=ground_heat] == flow_in[carriers=electricity] * 
          carrier_flow_ratio_in
      - where: '[heat_pump_geothermal_community] in techs'
        expression: flow_in[carriers=ground_heat] == flow_in[carriers=electricity] * 
          carrier_flow_ratio_in
      - where: '[heat_pump_geothermal_household] in techs'
        expression: flow_in[carriers=ground_heat] == flow_in[carriers=electricity] * 
          carrier_flow_ratio_in
  link_flow_out_carriers:
    description: Ties each technology's secondary output carrier to its primary output carrier via 
      carrier_flow_ratio_out.
    foreach:
      - nodes
      - techs
      - timesteps
    where: carrier_flow_ratio_out AND [chp_biomass_community] in techs
    equations:
      - where: '[chp_biomass_community] in techs'
        expression: flow_out[carriers=heat] == flow_out[carriers=electricity] * 
          carrier_flow_ratio_out
  balance_conversion:
    description: Calliope's base balance_conversion, unchanged, for every conversion technology 
      EXCEPT those with more than one carrier on a side, which get 
      balance_conversion_primary_carriers instead. Overriding this constraint replaces the base one,
      so this branch must stay -- see docs/calliope_schema_mapping.md 'Carrier ratio math'.
    foreach:
      - nodes
      - techs
      - timesteps
    where: base_tech==conversion AND NOT include_storage==true AND NOT 
      [chiller_absorption_community, chp_biomass_community, heat_pump_electric_building, 
      heat_pump_electric_community, heat_pump_electric_household, heat_pump_geothermal_building, 
      heat_pump_geothermal_community, heat_pump_geothermal_household] in techs
    equations:
      - expression: sum(flow_out_inc_eff, over=carriers) == sum(flow_in_inc_eff, over=carriers)
  balance_conversion_primary_carriers:
    description: "Conversion balance for technologies with more than one carrier on one side, on each
      side's primary carrier only: link_flow_in_carriers/link_flow_out_carriers tie every secondary carrier
      to that primary separately. The base summed balance would double-count input for a technology with
      a real efficiency on more than one carrier of the same side -- see docs/calliope_schema_mapping.md."
    foreach:
      - nodes
      - techs
      - timesteps
    where: base_tech==conversion AND NOT include_storage==true AND [chiller_absorption_community, 
      chp_biomass_community, heat_pump_electric_building, heat_pump_electric_community, 
      heat_pump_electric_household, heat_pump_geothermal_building, heat_pump_geothermal_community, 
      heat_pump_geothermal_household] in techs
    equations:
      - where: '[chiller_absorption_community] in techs'
        expression: flow_out_inc_eff[carriers=cooling] == flow_in_inc_eff[carriers=heat]
      - where: '[chp_biomass_community] in techs'
        expression: flow_out_inc_eff[carriers=electricity] == flow_in_inc_eff[carriers=biomass]
      - where: '[heat_pump_electric_building] in techs'
        expression: flow_out_inc_eff[carriers=heat] == flow_in_inc_eff[carriers=electricity]
      - where: '[heat_pump_electric_community] in techs'
        expression: flow_out_inc_eff[carriers=heat] == flow_in_inc_eff[carriers=electricity]
      - where: '[heat_pump_electric_household] in techs'
        expression: flow_out_inc_eff[carriers=heat] == flow_in_inc_eff[carriers=electricity]
      - where: '[heat_pump_geothermal_building] in techs'
        expression: flow_out_inc_eff[carriers=heat] == flow_in_inc_eff[carriers=electricity]
      - where: '[heat_pump_geothermal_community] in techs'
        expression: flow_out_inc_eff[carriers=heat] == flow_in_inc_eff[carriers=electricity]
      - where: '[heat_pump_geothermal_household] in techs'
        expression: flow_out_inc_eff[carriers=heat] == flow_in_inc_eff[carriers=electricity]
  flow_out_max_availability:
    description: 'A technology with time-varying availability may only use the available share of its
      capacity: flow_out <= flow_cap x timestep_resolution x flow_out_max_relative.'
    foreach:
      - nodes
      - techs
      - carriers
      - timesteps
    where: carrier_out AND [ev_charger_ac_household, ev_charger_dc_community, ev_v2g_household] in 
      techs
    equations:
      - expression: flow_out <= flow_cap * timestep_resolution * flow_out_max_relative
  storage_final_level_min:
    description: A storage technology must end the model period with at least storage_final_min x 
      storage_cap stored.
    foreach:
      - nodes
      - techs
    where: storage AND storage_final_min AND [battery_lithium_ion_community, 
      battery_lithium_ion_household, ev_battery_household] in techs
    equations:
      - expression: storage[timesteps=$final_step] >= storage_final_min * storage_cap
    slices:
      final_step:
        - expression: get_val_at_index(timesteps=-1)
